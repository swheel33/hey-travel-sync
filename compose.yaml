services:
  sync:
    build: .
    image: hey-travel-sync:local
    restart: unless-stopped
    init: true
    env_file: .env
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - hey-travel-data:/data
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3" }

volumes:
  hey-travel-data:
