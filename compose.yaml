services:
  sync:
    build:
      context: .
    image: hey-travel-sync:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /data/home
      XDG_CONFIG_HOME: /data/home/.config
      XDG_DATA_HOME: /data/home/.local/share
      HEY_NO_KEYRING: "1"
      HEY_TRAVEL_CONFIG: /config/config.toml
    volumes:
      - hey-travel-data:/data
      - ./config.toml:/config/config.toml:ro
    command: ["watch"]
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hey-travel-data:
